version: 2

models:
  - name: stg_fhv_taxidata
    description: "Staged data for fhv taxi trips"
    columns:
      - name: tripid
        description: "Primary key for this table, generated using a surrogate key"
        tests:
          - unique
          - not_null
      - name: dispatching_base_num
        tests:
          - not_null
      - name: pickup_datetime
        tests:
          - not_null
          