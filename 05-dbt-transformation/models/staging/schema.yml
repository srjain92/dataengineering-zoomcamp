version: 2

models:
  - name: stg_yellow_tripdata
    description: "Staged data for yellow taxi trips"
    columns:
      - name: tripid
        description: "Primary key for this table, generated using a surrogate key"
        tests:
          - unique
          - not_null
      - name: payment_type
        description: "Payment type used for the trip"
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6]
                quote: false
              config:
                severity: warn

  - name: stg_green_tripdata
    description: "Staged data for green taxi trips"
    columns:
      - name: tripid
        description: "Primary key for this table, generated using a surrogate key"
        tests:
          - unique
          - not_null